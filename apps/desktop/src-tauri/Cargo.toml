[package]
name = "ptconductor-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"

[lib]
name = "ptconductor_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ptc-domain = { path = "../../../crates/ptc-domain" }
ptc-engine = { path = "../../../crates/ptc-engine" }
ptc-persistence = { path = "../../../crates/ptc-persistence" }
ptc-providers = { path = "../../../crates/ptc-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
