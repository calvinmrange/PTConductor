name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install loopback scan dependency
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: CLI integration including real loopback Nmap
        run: |
          cargo build --locked -p ptconductor-cli
          PTC_TEST_REAL_NMAP=1 python3 tests/integration.py
      - name: Package CLI
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ptconductor-linux-cli
          path: dist/*.tar.gz
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Build frontend and desktop package
        working-directory: apps/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run tauri build -- --bundles deb -- --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-test-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ptconductor-linux-desktop
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
